name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run TypeScript type check
      run: npm run typecheck
    
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true # Allow lint failures for now

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    # File mode only (vitest projects `file` and `file-concurrency`). The cloud mode tests need agora and run in the
    # `cloud-tests` job.
    - name: Run unit tests
      run: npm run test:file
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [messaging, rooms, management]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ${{ matrix.feature }} tests
      run: npm run test:file -- tests/${{ matrix.feature }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, feature-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run integration tests
      run: npm run test:file -- tests/integration
      env:
        AGENT_COMM_DATA_DIR: ./test-data
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: test-results/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Run E2E tests
      run: npm run test:file -- tests/e2e
      env:
        AGENT_COMM_DATA_DIR: ./test-data
        E2E_TESTS: true
    
    - name: Upload E2E test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-failures
        path: |
          test-data/
          logs/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  cloud-tests:
    name: Cloud Mode Tests (agora on wrangler dev)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    timeout-minutes: 30

    # The cloud mode tests (vitest projects `cloud-compat` and `cloud`) start the real agora API with
    # `wrangler dev` from AGORA_DIR (default ../agora). actions/checkout only writes inside the workspace, so both
    # repositories are checked out side by side: agent-communication-mcp/ and agora/, i.e. agora is ../agora.
    # mkXultra/agora is private: the AGORA_REPO_TOKEN secret must be a token with read access to its contents.
    # Without agora the tests fail (they are never skipped); pull requests from forks get no secrets and fail too.
    # Node.js 22: the wrangler that agora pins (4.x) refuses to start on older versions.
    steps:
    - name: Require access to agora
      env:
        AGORA_REPO_TOKEN: ${{ secrets.AGORA_REPO_TOKEN }}
      run: |
        if [ -z "$AGORA_REPO_TOKEN" ]; then
          echo "::error::The AGORA_REPO_TOKEN secret is not available (not configured, or a pull request from a fork). The cloud mode tests need the private mkXultra/agora repository."
          exit 1
        fi

    - name: Checkout agent-communication-mcp
      uses: actions/checkout@v4
      with:
        path: agent-communication-mcp

    - name: Checkout agora
      uses: actions/checkout@v4
      with:
        repository: mkXultra/agora
        path: agora
        token: ${{ secrets.AGORA_REPO_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          agent-communication-mcp/package-lock.json
          agora/package-lock.json

    - name: Install dependencies
      working-directory: agent-communication-mcp
      run: npm ci

    - name: Install agora dependencies (wrangler)
      working-directory: agora
      run: npm ci

    - name: Run cloud mode tests
      working-directory: agent-communication-mcp
      run: npm run test:cloud
      env:
        AGORA_DIR: ${{ github.workspace }}/agora
        WRANGLER_SEND_METRICS: 'false'
