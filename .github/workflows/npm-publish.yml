name: NPM Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run All Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test]
    # npm Trusted Publishing (OIDC): no NPM_TOKEN. The trusted publisher on npmjs.com is
    # mkXultra/agent-communication-mcp, workflow npm-publish.yml. Needs id-token: write and npm >= 11.5.
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm (Trusted Publishing needs npm >= 11.5)
      run: npm install -g npm@latest && npm --version
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Publish to npm
      if: ${{ !github.event.release.prerelease }}
      run: npm publish